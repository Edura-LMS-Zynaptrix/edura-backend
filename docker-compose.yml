services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edura
      POSTGRES_PASSWORD: edura
      POSTGRES_DB: edura
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"


  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://edura:edura@postgres:5432/edura}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SECRET_KEY: ${SECRET_KEY:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user_service:
