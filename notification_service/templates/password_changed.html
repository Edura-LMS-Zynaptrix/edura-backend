<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Edura password was changed</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; border-bottom: 2px solid #0d9488; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: #0d9488; margin: 0; font-size: 24px; }
        .footer { margin-top: 30px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Password Changed</h1>
        </div>
        <p>Hello,</p>
        <p>The password for your Edura account was just reset, and you've been signed out on all devices.</p>
        <p>If this was you, no action is needed. If it wasn't, reset your password again straight away and contact support.</p>
        <div class="footer">
            &copy; Edura Learning Platform. All rights reserved.
        </div>
    </div>
</body>
</html>
