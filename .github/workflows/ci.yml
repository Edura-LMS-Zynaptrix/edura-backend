name: Backend CI — Microservices Matrix

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  verify-service:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    # This prevents GitHub from cancelling the other 10 services if 1 fails
    strategy:
      fail-fast: false 
      matrix:
        # The 11 services defined in your project architecture[cite: 1]
        service: 
          - auth_service
          - user_service
          - course_service
          - content_service
          - enrollment_service
          - payment_service
          - assessment_service
          - progress_service
          - notification_service
          - analytics_service
          - admin_service

    # Spin up isolated test databases for the specific runner[cite: 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout the edura-backend code (No PAT required here anymore!)
      - name: Checkout Backend Repo
        uses: actions/checkout@v4

      # Setup Python environment[cite: 2]
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up installation

      # Install global linting and testing tools[cite: 2]
      - name: Install Base Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pytest-cov httpx pip-audit

      # Install the specific dependencies for the current matrix service
      - name: Install ${{ matrix.service }} Dependencies
        run: |
          if [ -f "${{ matrix.service }}/requirements.txt" ]; then
            pip install -r ${{ matrix.service }}/requirements.txt
          fi

      # Run Linters[cite: 2]
      - name: Run Ruff
        run: ruff check ${{ matrix.service }}/

      - name: Run Black
        run: black --check ${{ matrix.service }}/

      # Setup specific database for this service[cite: 2]
      - name: Create Test Database
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "CREATE DATABASE test_db_${{ matrix.service }};" || true

      # Run Pytest for this specific service[cite: 2]
      - name: Run Unit Tests
        env:
          REDIS_HOST: localhost
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db_${{ matrix.service }}
          PYTHONPATH: ${{ matrix.service }}
        run: |
          if [ -d "${{ matrix.service }}/tests" ]; then
            pytest ${{ matrix.service }} --cov=${{ matrix.service }} --cov-report=xml
          else
            echo "No tests folder found for ${{ matrix.service }}, skipping pytest."
          fi

      # Run Security Audit on the service's dependencies[cite: 2]
      - name: Security Scan
        run: |
          if [ -f "${{ matrix.service }}/requirements.txt" ]; then
            pip-audit -r ${{ matrix.service }}/requirements.txt
          fi